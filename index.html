<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PrompTool</title>
<style>
/* Self-hosted. No third-party requests — the page works offline and never phones home.
   All three families are SIL Open Font License 1.1; see fonts/LICENSE.md. */
@font-face{font-family:'Orbitron';font-weight:900;font-display:swap;src:url('fonts/orbitron-900.woff2') format('woff2');}
@font-face{font-family:'Rajdhani';font-weight:700;font-display:swap;src:url('fonts/rajdhani-700.woff2') format('woff2');}
@font-face{font-family:'JetBrains Mono';font-weight:400;font-display:swap;src:url('fonts/jetbrains-mono-400.woff2') format('woff2');}
@font-face{font-family:'JetBrains Mono';font-weight:700;font-display:swap;src:url('fonts/jetbrains-mono-700.woff2') format('woff2');}

:root{
  --bg:#07080e; --surface:#0f1119; --surface2:#161a26; --surface3:#1f2533;
  --border:#222a3c; --border2:#313c54;
  --acid:#e8ff47; --miku:#39d4c8; --pink:#ff4da6; --green:#5dffb0;
  --text:#dfe6f0; --muted:#54607a; --muted2:#808ea8;
  --glow-acid:0 0 14px rgba(232,255,71,.35);
  --glow-miku:0 0 12px rgba(57,212,200,.35);
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{
  font-family:'JetBrains Mono',ui-monospace,monospace; font-size:13px; line-height:1.5;
  background:var(--bg); color:var(--text); display:flex; flex-direction:column; overflow:hidden;
  background-image:
    radial-gradient(1100px 600px at 10% -10%, rgba(232,255,71,.05), transparent 60%),
    radial-gradient(900px 600px at 100% 0%, rgba(57,212,200,.05), transparent 55%),
    radial-gradient(900px 700px at 85% 110%, rgba(255,77,166,.04), transparent 55%);
}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:var(--surface3);border-radius:5px;}
::-webkit-scrollbar-track{background:transparent;}

/* ── header ── */
#header{height:48px;flex-shrink:0;display:flex;align-items:center;gap:10px;padding:0 14px;
  background:linear-gradient(180deg,var(--surface),var(--bg));border-bottom:1px solid var(--border);}
#logo{font-family:'Orbitron',sans-serif;font-weight:900;font-size:15px;letter-spacing:.2em;
  color:var(--acid);text-shadow:var(--glow-acid);}
#logo i{font-style:normal;color:var(--miku);text-shadow:var(--glow-miku);}
.grow{flex:1;}
.hint{color:var(--muted);font-size:11px;}

/* ── controls ── */
button,input,select,textarea{font-family:inherit;font-size:inherit;color:var(--text);
  background:var(--surface2);border:1px solid var(--border);border-radius:5px;padding:5px 9px;outline:none;}
button{cursor:pointer;transition:border-color .12s,color .12s;white-space:nowrap;}
button:hover{border-color:var(--acid);color:var(--acid);}
button.primary{border-color:var(--acid-dim,#454f17);color:var(--acid);}
input:focus,select:focus,textarea:focus{border-color:var(--border2);}
input::placeholder,textarea::placeholder{color:var(--muted);}

/* ── layout ── */
#layout{flex:1;display:flex;min-height:0;}
#sidebar{width:288px;flex-shrink:0;border-right:1px solid var(--border);
  display:flex;flex-direction:column;min-height:0;background:rgba(15,17,25,.55);}
#editor{flex:1;min-width:0;overflow-y:auto;padding:14px 16px 60px;}
#preview-pane{width:37%;min-width:300px;flex-shrink:0;border-left:1px solid var(--border);
  display:flex;flex-direction:column;min-height:0;background:rgba(15,17,25,.55);}

.pane-head{display:flex;align-items:center;gap:7px;padding:7px 9px;flex-shrink:0;
  border-bottom:1px solid var(--border);background:var(--surface);}
.pane-label{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:12px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted2);}
.list{flex:1;overflow-y:auto;min-height:0;}
.list:empty::after{content:'nothing yet';display:block;padding:14px 10px;color:var(--muted);font-size:11px;}

.row{padding:7px 10px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s;}
.row:hover{background:var(--surface2);}
.row.on{background:var(--surface3);box-shadow:inset 2px 0 0 var(--acid);}
.row-title{display:flex;align-items:center;gap:6px;}
.row-sub{color:var(--muted);font-size:11px;margin-top:1px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.badge{font-size:9px;font-weight:700;letter-spacing:.1em;padding:1px 5px;border-radius:3px;
  background:var(--miku);color:var(--bg);}
.tagchip{color:var(--miku);}

/* ── sections ── */
#prompt-bar{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
#prompt-name{flex:1;font-size:15px;font-weight:700;background:none;border:none;border-bottom:1px solid var(--border);border-radius:0;padding:6px 2px;}
#prompt-name:focus{border-bottom-color:var(--acid);}

.section{border:1px solid var(--border);border-radius:7px;margin-bottom:10px;background:var(--surface);
  transition:border-color .12s;}
.section:focus-within{border-color:var(--border2);}
.section.off{opacity:.45;}
.section.drag{border-color:var(--acid);border-style:dashed;}
.section-head{display:flex;align-items:center;gap:8px;padding:5px 8px;border-bottom:1px solid var(--border);}
.section-num{background:var(--acid);color:var(--bg);font-weight:700;font-size:11px;
  border-radius:3px;padding:0 5px;cursor:grab;}
.section-tag{width:210px;background:none;border:none;color:var(--miku);padding:2px 0;font-weight:700;}
.section-tag:focus{color:var(--acid);}
.section-head label{display:flex;align-items:center;gap:4px;color:var(--muted);font-size:11px;cursor:pointer;}
.section-body{width:100%;min-height:74px;background:none;border:none;border-radius:0;
  padding:9px 10px;resize:vertical;line-height:1.6;}
.icon{background:none;border:none;color:var(--muted);padding:2px 5px;}
.icon:hover{color:var(--pink);}

/* ── preview ── */
#preview{flex:1;overflow:auto;padding:12px 13px;white-space:pre-wrap;word-break:break-word;
  font-size:12.5px;line-height:1.65;color:var(--muted2);}
#preview .t{color:var(--acid);text-shadow:var(--glow-acid);}
#preview:empty::after{content:'// nothing included yet';color:var(--surface3);}

/* ── completion popup ── */
#ac{position:fixed;z-index:40;background:var(--surface2);border:1px solid var(--border2);
  border-radius:5px;padding:3px;display:none;max-width:340px;box-shadow:0 8px 24px rgba(0,0,0,.6);}
#ac div{padding:3px 8px;border-radius:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#ac div.on{background:var(--surface3);color:var(--acid);}
#ac b{color:var(--miku);}

/* ── misc ── */
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:60;
  background:var(--surface3);border:1px solid var(--acid);border-radius:5px;padding:7px 15px;
  opacity:0;transition:opacity .18s;pointer-events:none;}
#toast.on{opacity:1;}
dialog{background:var(--surface);color:var(--text);border:1px solid var(--border2);border-radius:9px;
  padding:16px;width:min(560px,92vw);}
dialog::backdrop{background:rgba(0,0,0,.6);}
#bank-text{width:100%;height:300px;line-height:1.7;resize:vertical;}
.dlg-foot{display:flex;gap:8px;justify-content:flex-end;margin-top:11px;}
#empty{color:var(--muted);text-align:center;padding:70px 20px;}
</style>
</head>
<body>

<div id="header">
  <div id="logo">PROMP<i>TOOL</i></div>
  <button id="btn-new" class="primary">+ New</button>
  <button id="btn-add-section">+ Section</button>
  <button id="btn-template">Template</button>
  <button id="btn-delete">Delete</button>
  <div class="grow"></div>
  <span class="hint">Tab completes &nbsp;·&nbsp; Ctrl+M banks selection</span>
  <button id="btn-bank">Bank</button>
  <button id="btn-export">Export</button>
  <button id="btn-import">Import</button>
  <input id="file-import" type="file" accept="application/json" hidden>
</div>

<div id="layout">

  <div id="sidebar">
    <div class="pane-head">
      <span class="pane-label">Prompts</span>
      <select id="filter-kind">
        <option value="">all</option><option value="filled">filled</option><option value="template">templates</option>
      </select>
    </div>
    <div class="pane-head" style="border-bottom:none;padding-bottom:4px;">
      <input id="q-prompts" class="grow" placeholder="search prompts…" spellcheck="false">
    </div>
    <div id="list-prompts" class="list"></div>

    <div class="pane-head" style="border-top:1px solid var(--border);">
      <span class="pane-label">Section library</span>
      <select id="filter-tag"><option value="">all tags</option></select>
    </div>
    <div class="pane-head" style="border-bottom:none;padding-bottom:4px;">
      <input id="q-sections" class="grow" placeholder="search sections…" spellcheck="false">
    </div>
    <div id="list-sections" class="list"></div>
  </div>

  <div id="editor">
    <div id="prompt-bar">
      <input id="prompt-name" placeholder="untitled" spellcheck="false">
    </div>
    <div id="sections"></div>
    <div id="empty">No prompt selected — hit <b>+ New</b>.</div>
  </div>

  <div id="preview-pane">
    <div class="pane-head">
      <span class="pane-label">Output</span>
      <div class="grow"></div>
      <span id="char-count" class="hint"></span>
      <button id="btn-copy">Copy</button>
      <button id="btn-save-file">Save .xml</button>
    </div>
    <pre id="preview"></pre>
  </div>

</div>

<div id="ac"></div>

<dialog id="dlg-bank">
  <div class="pane-label" style="margin-bottom:8px;">Term bank — one per line</div>
  <p class="hint" style="margin-bottom:9px;">
    These complete on Tab in every prompt, and always rank above words harvested from the document.</p>
  <textarea id="bank-text" spellcheck="false"></textarea>
  <div class="dlg-foot">
    <button id="btn-bank-close">Cancel</button>
    <button id="btn-bank-save" class="primary">Save</button>
  </div>
</dialog>

<div id="toast"></div>

<script src="src/model.js"></script>
<script src="src/serialize.js"></script>
<script src="src/complete.js"></script>
<script src="src/store.js"></script>
<script src="src/search.js"></script>
<script src="src/seed.js"></script>
<script src="src/ui.js"></script>
</body>
</html>
