<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>md2xml</title>
<style>
  :root { --bg:#111; --fg:#ddd; --mut:#888; --acc:#9f6; --pane:#181818; --line:#2a2a2a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.5 ui-monospace,Menlo,Consolas,monospace; }
  header { display:flex; align-items:center; gap:12px; padding:10px 16px; border-bottom:1px solid var(--line); }
  header b { color:var(--acc); }
  header span { color:var(--mut); font-size:12px; }
  button { margin-left:auto; background:var(--acc); color:#000; border:0; padding:6px 14px; font:inherit; font-weight:700; cursor:pointer; }
  main { display:grid; grid-template-columns:1fr 1fr; height:calc(100vh - 45px); }
  textarea, pre { margin:0; padding:14px 16px; background:var(--pane); color:var(--fg); border:0; font:inherit; overflow:auto; white-space:pre-wrap; word-break:break-word; }
  textarea { resize:none; outline:none; border-right:1px solid var(--line); }
  pre .t { color:var(--acc); }
  @media (max-width:800px) { main { grid-template-columns:1fr; grid-template-rows:1fr 1fr; } textarea { border-right:0; border-bottom:1px solid var(--line); } }
</style>
</head>
<body>
<header><b>md2xml</b><span>markdown headings become tags · text before the first heading is &lt;instructions&gt;</span><button id="copy">Copy</button></header>
<main>
  <textarea id="in" spellcheck="false" placeholder="# role
You are a senior engineer.

# task
Refactor the parser.

# constraints
No new dependencies."></textarea>
  <pre id="out"></pre>
</main>
<script>
/*MD2XML-START*/
function slug(t) {
  var s = String(t).toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '');
  if (!s) return 'section';
  return /^[a-z]/.test(s) ? s : 's_' + s;
}
function mdToXml(md) {
  var lines = String(md || '').replace(/\r\n?/g, '\n').split('\n');
  var sections = [], cur = { tag: 'instructions', body: [] }, fence = false;
  for (var i = 0; i < lines.length; i++) {
    var line = lines[i];
    if (/^\s{0,3}(```|~~~)/.test(line)) { fence = !fence; cur.body.push(line); continue; }
    var m = !fence && /^\s{0,3}#{1,6}\s+(.+?)\s*#*\s*$/.exec(line);
    if (m) { sections.push(cur); cur = { tag: slug(m[1]), body: [] }; }
    else cur.body.push(line);
  }
  sections.push(cur);
  return sections
    .map(function (s) { return { tag: s.tag, body: s.body.join('\n').replace(/^\n+|\n+$/g, '') }; })
    .filter(function (s) { return s.body.trim() !== ''; })
    .map(function (s) { return '<' + s.tag + '>\n' + s.body + '\n</' + s.tag + '>'; })
    .join('\n\n');
}
/*MD2XML-END*/
var inEl = document.getElementById('in'), outEl = document.getElementById('out'), btn = document.getElementById('copy');
function esc(s) { return s.replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); }
function render() {
  var xml = mdToXml(inEl.value);
  outEl.innerHTML = esc(xml).replace(/^(&lt;\/?[a-z0-9_]+&gt;)$/gm, '<span class="t">$1</span>');
}
inEl.addEventListener('input', render);
btn.addEventListener('click', function () {
  var xml = mdToXml(inEl.value);
  if (!xml) return;
  navigator.clipboard.writeText(xml).then(function () {
    btn.textContent = 'Copied'; setTimeout(function () { btn.textContent = 'Copy'; }, 1200);
  });
});
render();
</script>
</body>
</html>
